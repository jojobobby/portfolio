server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Never build redirects from nginx's own host:port (8080 behind the ingress).
    absolute_redirect off;

    # Astro emits /path/index.html; serve /path and /path/ alike.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Hashed build assets never change; pages and media revalidate.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location ~* \.(gif|jpg|jpeg|png|svg|webp)$ {
        expires 7d;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location = /healthz { access_log off; return 200 "ok\n"; }
}
