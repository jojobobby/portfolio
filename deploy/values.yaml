image:
  repository: ghcr.io/jojobobby/portfolio
  # Set by CI on every push to main (the short commit SHA). Do not edit by hand.
  tag: "32e3089"
  pullPolicy: IfNotPresent

# Two replicas so a rollout or a pod restart never takes the site down.
replicas: 2

host: rrobinson.me
tlsSecret: rrobinson.me-tls
clusterIssuer: letsencrypt-prod
# Also answer www.<host> with a redirect to <host> (needs a www DNS record).
wwwRedirect: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
