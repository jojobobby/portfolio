image:
  repository: ghcr.io/jojobobby/portfolio
  # Set by CI on every push to main (the short commit SHA). Do not edit by hand.
  tag: "c362ae5"
  pullPolicy: IfNotPresent

# Two replicas so a rollout or a pod restart never takes the site down.
replicas: 2

host: rrobinson.me
tlsSecret: rrobinson.me-tls
clusterIssuer: letsencrypt-prod
# Also answer www.<host> with a redirect to <host> (needs a www DNS record).
wwwRedirect: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Comments + video sync API (api/ in this repo), served at <host>/api.
apiImage:
  repository: ghcr.io/jojobobby/portfolio-api
# Set by CI on every push to main. Do not edit by hand.
apiTag: "c362ae5"
api:
  # Out-of-band Secret: DATABASE_URL, ADMIN_TOKEN (secret.example.yaml)
  existingSecret: portfolio-api
  youtubeHandle: "@RalphOfc"
  # Submission to the inbox server as noreply@ (SMTP_USER/SMTP_PASS in the Secret).
  smtpHost: inbox.inbox.svc
  mailFrom: "Rapheal Robinson <noreply@tidangames.com>"
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
