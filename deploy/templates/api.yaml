# Comments (stored in the shared Postgres, database `portfolio`) and the YouTube video list
# (synced every 6 hours: titles, dates and thumbnails only). Served at https://<host>/api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  labels:
    app.kubernetes.io/name: portfolio-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.apiImage.repository }}:{{ .Values.apiTag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: SITE_URL, value: "https://{{ .Values.host }}" }
            - { name: YOUTUBE_HANDLE, value: {{ .Values.api.youtubeHandle | quote }} }
            - { name: SMTP_HOST, value: {{ .Values.api.smtpHost | quote }} }
            - { name: MAIL_FROM, value: {{ .Values.api.mailFrom | quote }} }
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-api
  labels:
    app.kubernetes.io/name: portfolio-api
spec:
  selector:
    app.kubernetes.io/name: portfolio-api
  ports:
    - name: http
      port: 80
      targetPort: http
