name: deploy

# Every push to main builds the site into a container image, pushes it to GHCR, and points
# the Helm chart (deploy/values.yaml) at it. Argo CD sees that commit and rolls it out.
on:
  push:
    branches: [main]
    # The tag bump below edits deploy/, so ignoring it stops the pipeline re-triggering itself.
    paths-ignore:
      - 'deploy/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API tests
        run: cd api && npm ci --no-audit --no-fund && npm test

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jojobobby/portfolio:${{ steps.tag.outputs.short }}
            ghcr.io/jojobobby/portfolio:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push the API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/jojobobby/portfolio-api:${{ steps.tag.outputs.short }}
            ghcr.io/jojobobby/portfolio-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Point the chart at the new images
        run: |
          sed -i "s|^  tag: .*|  tag: \"${{ steps.tag.outputs.short }}\"|" deploy/values.yaml
          sed -i "s|^apiTag: .*|apiTag: \"${{ steps.tag.outputs.short }}\"|" deploy/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/values.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore: deploy ${{ steps.tag.outputs.short }}"
          git pull --rebase origin main
          git push origin main
